name: release-tauri

on:
  push:
    tags:
      - 'tauri-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag that fails the suite must not publish. This also derives the version
  # once, so all build jobs agree on it.
  gate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      # tauri-v0.1.0 -> 0.1.0
      - name: Derive the version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#tauri-v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: |
          pnpm --filter @metacubexd/agent test
          pnpm --filter @metacubexd/config-editor test
          pnpm --filter @metacubexd/tauri test
          pnpm --filter @metacubexd/ui test:unit

  build-desktop:
    needs: gate

    strategy:
      # One platform failing should not cancel the others. The publish job waits
      # for every required build, so failures still prevent an incomplete draft
      # release while preserving the useful logs and artifacts from successes.
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: ubuntu-22.04
            args: ''
            rustTargets: ''
          - name: windows-x64
            platform: windows-latest
            args: ''
            rustTargets: ''
          # One .dmg covering Apple Silicon and Intel, so users never pick wrong.
          - name: darwin-universal
            platform: macos-latest
            args: '--target universal-apple-darwin'
            rustTargets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          key: ${{ matrix.platform }}
          # A live-fire retry (rc1 -> rc2) should not pay a full cold Rust
          # build on all three legs just because one of them failed.
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libdbus-1-dev

      - name: Install dependencies
        run: pnpm install

      # The tag is the source of truth for the version, so artifact filenames
      # always match the tag that produced them.
      #
      # shell: bash so this behaves identically on the Windows runner, which
      # otherwise defaults to PowerShell and its different quoting rules.
      #
      # The version is passed through env rather than interpolated into the
      # script text: git tag names may contain $, `, and ".
      - name: Set the bundle version from the tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs")
            const path = "apps/tauri/src-tauri/tauri.conf.json"
            const config = JSON.parse(fs.readFileSync(path, "utf8"))
            const version = process.env.VERSION
            config.version = version
            // WiX (the MSI bundler) requires the pre-release identifier to be
            // numeric and <=65535, which a "-rc1" style tag is not. Override
            // just the MSI version with the release triplet; artifact
            // filenames still come from config.version above.
            config.bundle ??= {}
            config.bundle.windows ??= {}
            config.bundle.windows.wix ??= {}
            config.bundle.windows.wix.version = version.split("-")[0]
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n")
          '

      # The package build script also does this, but the explicit step keeps the
      # generated input visible before Tauri compiles Rust.
      - name: Generate the transport shim
        run: pnpm --filter @metacubexd/tauri build:shim

      - name: Build desktop bundle
        working-directory: apps/tauri
        shell: bash
        run: node run-tauri.mjs build ${{ matrix.args }}

      - name: Collect desktop release artifacts
        env:
          PLATFORM_NAME: ${{ matrix.name }}
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          case "$PLATFORM_NAME" in
            linux-x64)
              cp apps/tauri/src-tauri/target/release/bundle/deb/*.deb release-artifacts/
              cp apps/tauri/src-tauri/target/release/bundle/rpm/*.rpm release-artifacts/
              cp apps/tauri/src-tauri/target/release/app release-artifacts/app_linux_x64
              ;;
            windows-x64)
              cp apps/tauri/src-tauri/target/release/bundle/msi/*.msi release-artifacts/
              cp apps/tauri/src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
              cp apps/tauri/src-tauri/target/release/app.exe release-artifacts/app_windows_x64.exe
              ;;
            darwin-universal)
              base="apps/tauri/src-tauri/target/universal-apple-darwin/release"
              cp "$base"/bundle/dmg/*.dmg release-artifacts/
              app_dir="$(find "$base/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$app_dir"
              tar -czf "release-artifacts/MetaCubeXD_${VERSION}_universal.app.tar.gz" -C "$(dirname "$app_dir")" "$(basename "$app_dir")"
              cp "$base/app" release-artifacts/app_darwin_universal
              ;;
            *)
              echo "unknown platform $PLATFORM_NAME" >&2
              exit 1
              ;;
          esac

          find release-artifacts -maxdepth 1 -type f -print -quit | grep -q .
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 5

  build-android:
    needs: gate
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: lts/*

      - uses: actions/setup-java@v5
        with:
          cache: gradle
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0 ndk;29.0.13113456'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          key: android
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install

      - name: Set the bundle version from the tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs")
            const path = "apps/tauri/src-tauri/tauri.conf.json"
            const config = JSON.parse(fs.readFileSync(path, "utf8"))
            config.version = process.env.VERSION
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n")
          '

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          keystore="$RUNNER_TEMP/metacubexd-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"

          cd apps/tauri/src-tauri/gen/android
          {
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$keystore"
          } > keystore.properties

      - name: Build signed Android APK
        run: pnpm --filter @metacubexd/tauri android:build

      - name: Build signed Android arm64 APK
        run: pnpm --filter @metacubexd/tauri android:build:arm64

      - name: Collect Android release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          universal="apps/tauri/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          arm64="apps/tauri/src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
          test -f "$universal"
          test -f "$arm64"
          cp "$universal" "$arm64" release-artifacts/
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 5

  publish:
    needs:
      - gate
      - build-desktop
      - build-android
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-artifacts
          pattern: release-*

      - name: Publish draft release
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -maxdepth 1 -type f -print -quit | grep -q .
          ls -lh release-artifacts

          prerelease_args=()
          if [[ "$TAG_NAME" == *-rc* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/* --clobber
          else
            gh release create "$TAG_NAME" release-artifacts/* \
              --draft \
              "${prerelease_args[@]}" \
              --title "MetaCubeXD $VERSION" \
              --notes "Draft release generated from $TAG_NAME."
          fi
