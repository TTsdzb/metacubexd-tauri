[package]
name = "app"
version = "0.1.0"
# These are not cosmetic: with `bundle.targets: "all"`, the deb/rpm/AppImage
# bundlers ship `description` as the package description and `authors` as the
# maintainer field.
description = "MetaCubeXD — dashboard for the Mihomo proxy kernel"
authors = ["TTsdzb <ttsdzb@outlook.com>"]
license = "MIT"
repository = "https://github.com/TTsdzb/metacubexd"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"

# Desktop-only plugins. Gated so `cargo build` for android/ios never sees them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
